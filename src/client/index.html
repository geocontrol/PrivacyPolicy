<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <span class="header__logo">🔍 Privacy Dashboard</span>
        <nav class="nav">
          <button class="nav__btn nav__btn--active" data-view="services">Services</button>
          <button class="nav__btn" data-view="supply-chain">Supply Chain</button>
          <button class="nav__btn" data-view="third-parties">Third Parties</button>
        </nav>
      </header>

      <main class="main">
        <!-- Views — only one visible at a time via .view--active -->
        <section id="view-services" class="view view--active"></section>
        <section id="view-supply-chain" class="view"></section>
        <section id="view-third-parties" class="view"></section>
      </main>
    </div>

    <!-- Slide-in detail panel for a single service -->
    <aside id="detail-panel" class="detail-panel">
      <button id="detail-close" class="detail-panel__close">✕</button>
      <div id="detail-content" class="detail-panel__content"></div>
    </aside>
    <div id="detail-overlay" class="overlay"></div>

    <!-- Sitemap selection modal -->
    <div id="sitemap-modal" class="modal modal--hidden">
      <div class="modal__backdrop" id="sitemap-modal-backdrop"></div>
      <div class="modal__panel">
        <div class="modal__header">
          <h3>Select Sitemap Pages</h3>
          <button id="sitemap-modal-close" class="modal__close">✕</button>
        </div>
        <div id="sitemap-modal-content" class="modal__content"></div>
        <div class="modal__footer">
          <label style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" id="sitemap-modal-analyse" checked />
            Analyse selected pages
          </label>
          <button id="sitemap-modal-collect" class="btn btn--primary">Collect Selected</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
